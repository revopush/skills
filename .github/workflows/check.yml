name: check

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# A newer push to a PR supersedes the run in progress. Runs on main are never
# cancelled, so every commit there ends with a pass or a fail.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned to a commit SHA so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: JSON files are valid
        run: |
          failed=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if python3 -m json.tool "$f" > /dev/null; then
              echo "OK $f"
            else
              echo "::error file=$f::invalid JSON"
              failed=1
            fi
          done < <(git ls-files -z -- '*.json')
          # Matching nothing means the listing itself broke; don't pass unchecked.
          if [ "$count" -eq 0 ]; then
            echo "::error::no tracked JSON files found"
            failed=1
          fi
          exit "$failed"

      # The plugin directory refuses code from organizations that aren't
      # Verified: only docs, data and images may ship, and nothing executable.
      - name: Plugin ships only files the directory accepts
        run: |
          failed=0
          while IFS= read -r -d '' f; do
            case "$f" in
              *.md | *.txt | *.json | *.yaml | *.yml | *.png | *.jpg | *.jpeg | *.gif | *.webp | *.ico) ;;
              *)
                echo "::error file=$f::file type not accepted by the plugin directory"
                failed=1
                continue
                ;;
            esac
            if [ "$(head -c 2 -- "$f")" = '#!' ]; then
              echo "::error file=$f::starts with #!"
              failed=1
            fi
          done < <(git ls-files -z -- plugins)
          if grep -n '"hooks"' plugins/*/.claude-plugin/plugin.json; then
            echo "::error::plugin.json declares hooks, which the plugin directory refuses"
            failed=1
          fi
          exit "$failed"
